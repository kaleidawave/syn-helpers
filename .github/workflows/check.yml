name: Check library

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable

    - name: Check
      run: cargo check

    - name: Test
      run: cargo test

    - name: Lint
      run: cargo clippy

    - name: Format
      run: cargo fmt
