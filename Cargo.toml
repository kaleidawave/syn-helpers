[package]
name = "syraise"
description = "Framework for building derive macros"
license = "MIT"
repository = "https://github.com/kaleidawave/syraise"
authors = ["Ben <kaleidawave@gmail.com>"]
keywords = ["proc-macro-derive", "code-generation", "enum"]
categories = [
    "development-tools::procedural-macro-helpers",
    "development-tools::build-utils",
]
version = "0.5.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proc-macro2 = "1.0"
quote.version = "1.0"
quote.optional = true
syn.version = "2.0"
syn.features = ["full", "visit", "visit-mut"]
syn.optional = true

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[features]
emit-string = []
syn = ["dep:syn"]
quote = ["dep:quote"]
syn-extra-traits = ["syn", "syn/extra-traits"]
